<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archetype 4: Inside-Out Mind Cockpit (NOT IN CHARGE)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1E293B 0%, #090D16 100%);
      font-family: 'Outfit', sans-serif;
      position: relative;
    }

    /* Giant Punch Headline */
    .headline {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 140px;
      font-weight: 900;
      color: #FFEE00;
      text-transform: uppercase;
      letter-spacing: -3px;
      -webkit-text-stroke: 18px #121212;
      paint-order: stroke fill;
      filter: drop-shadow(0 14px 0 #121212);
      z-index: 50;
      white-space: nowrap;
    }

    /* Shadow Puppet Strings descending from the top darkness */
    .puppet-strings {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      z-index: 15;
      pointer-events: none;
    }

    /* Hero SVG Stage */
    .stage {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 640px;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- Giant Punch Headline -->
  <div class="headline">NOT IN CHARGE</div>

  <!-- Shadow Puppet Strings & Ominous Hands -->
  <svg class="puppet-strings" viewBox="0 0 1280 720">
    <!-- Dark shadow claw reaching from top left -->
    <path d="M 0 0 L 180 80 Q 240 140 220 180" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.8" />
    <line x1="220" y1="180" x2="480" y2="400" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
    
    <!-- Dark shadow claw reaching from top right -->
    <path d="M 1280 0 L 1100 80 Q 1040 140 1060 180" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.8" />
    <line x1="1060" y1="180" x2="800" y2="400" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
  </svg>

  <!-- Hero Character with Brain Cockpit -->
  <svg class="stage" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg">
    <!-- Torso (Charcoal modern hoodie) -->
    <path d="M 330 380 L 570 380 L 630 640 L 270 640 Z" fill="#334155" stroke="#121212" stroke-width="9" />
    
    <!-- Stick Arms clutching head in existential panic -->
    <polyline points="340,430 240,320 310,240" stroke="#121212" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <polyline points="560,430 660,320 590,240" stroke="#121212" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Big White Egghead (Lower Face) -->
    <path d="M 310 220 Q 310 380 450 380 Q 590 380 590 220 Z" fill="#FFFFFF" stroke="#121212" stroke-width="9" />

    <!-- Panicked Facial Features -->
    <!-- Wide white panic eyes with tiny pinpoint pupils -->
    <circle cx="390" cy="270" r="30" fill="#FFFFFF" stroke="#121212" stroke-width="6" />
    <circle cx="390" cy="270" r="8" fill="#121212" />
    <circle cx="510" cy="270" r="30" fill="#FFFFFF" stroke="#121212" stroke-width="6" />
    <circle cx="510" cy="270" r="8" fill="#121212" />

    <!-- High, stressed arched eyebrows -->
    <path d="M 365 225 Q 390 205 415 220" stroke="#121212" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 485 220 Q 510 205 535 225" stroke="#121212" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Open shaking mouth (Scream/Shock) -->
    <ellipse cx="450" cy="330" rx="35" ry="24" fill="#E11D48" stroke="#121212" stroke-width="6" />
    <ellipse cx="450" cy="340" rx="20" ry="10" fill="#FDA4AF" />

    <!-- Sweat Drops -->
    <path d="M 280 260 Q 270 280 285 285 Q 295 280 280 260 Z" fill="#38BDF8" stroke="#121212" stroke-width="3" />
    <path d="M 610 260 Q 600 280 615 285 Q 625 280 610 260 Z" fill="#38BDF8" stroke="#121212" stroke-width="3" />

    <!-- ============================================== -->
    <!-- THE HINGED OPEN BRAIN COCKPIT (THE HERO TWIST) -->
    <!-- ============================================== -->
    <!-- Hinged Brain Dome / Lid tilted to the side -->
    <g transform="rotate(-25 580 140)">
      <!-- Giant Pink Stylized Brain Half -->
      <path d="M 320 140 Q 300 40 450 30 Q 600 40 580 140 Z" fill="#F472B6" stroke="#121212" stroke-width="8" />
      <!-- Brain folds -->
      <path d="M 370 120 Q 360 70 420 80 Q 450 60 480 90" stroke="#121212" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M 440 90 Q 480 120 540 100" stroke="#121212" stroke-width="6" stroke-linecap="round" fill="none" />
    </g>

    <!-- Cockpit Interior (Inside the head) -->
    <path d="M 315 220 Q 450 250 585 220 L 585 140 Q 450 110 315 140 Z" fill="#0F172A" stroke="#121212" stroke-width="8" />
    
    <!-- Control Dashboard with flashing dials -->
    <rect x="360" y="190" width="180" height="30" fill="#475569" stroke="#121212" stroke-width="4" />
    <circle cx="390" cy="205" r="8" fill="#EF4444" stroke="#121212" stroke-width="2" /> <!-- Red warning light -->
    <circle cx="420" cy="205" r="8" fill="#F59E0B" stroke="#121212" stroke-width="2" />
    <circle cx="450" cy="205" r="8" fill="#10B981" stroke="#121212" stroke-width="2" />
    
    <!-- Big Levers -->
    <line x1="490" y1="205" x2="480" y2="165" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <circle cx="480" cy="165" r="6" fill="#EF4444" />
    <line x1="515" y1="205" x2="525" y2="165" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <circle cx="525" cy="165" r="6" fill="#3B82F6" />

    <!-- Tiny Panicked Stickman Pilot frantically pulling levers -->
    <circle cx="450" cy="130" r="14" fill="#FFFFFF" stroke="#121212" stroke-width="4" />
    <!-- Pilot tiny open scream mouth -->
    <circle cx="450" cy="132" r="4" fill="#121212" />
    <line x1="450" y1="144" x2="450" y2="185" stroke="#121212" stroke-width="4" />
    <!-- Arms desperately grabbing the levers -->
    <line x1="450" y1="155" x2="480" y2="165" stroke="#121212" stroke-width="4" />
    <line x1="450" y1="155" x2="525" y2="165" stroke="#121212" stroke-width="4" />
    <!-- Legs in panicked stance -->
    <line x1="450" y1="185" x2="435" y2="200" stroke="#121212" stroke-width="4" />
    <line x1="450" y1="185" x2="465" y2="200" stroke="#121212" stroke-width="4" />
  </svg>

</body>
</html>
