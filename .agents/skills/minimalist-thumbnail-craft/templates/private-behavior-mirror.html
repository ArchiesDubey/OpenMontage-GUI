<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archetype 2: Private Behavior Mirror (FAKE SLEEP?)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #0066FF; /* Vibrant Blue Bedroom Wall */
      font-family: 'Outfit', sans-serif;
      position: relative;
    }

    /* Window with Night Sky & Crescent Moon */
    .window {
      position: absolute;
      top: 90px;
      right: 60px;
      width: 250px;
      height: 250px;
      background: #09122C;
      border: 12px solid #3A86FF;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
      z-index: 5;
    }
    .window-panes {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .pane { border: 4px solid #3A86FF; }
    
    .moon {
      position: absolute;
      top: 25px;
      right: 35px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      box-shadow: -18px 8px 0 2px #E0F2FE;
    }

    /* Punch Headline Text */
    .headline {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 155px;
      font-weight: 900;
      color: #FFEE00;
      text-transform: uppercase;
      letter-spacing: -3px;
      -webkit-text-stroke: 18px #121212;
      paint-order: stroke fill;
      filter: drop-shadow(0 14px 0 #121212);
      z-index: 50;
      white-space: nowrap;
    }

    /* Bed & Hero Container */
    .bed-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1280px;
      height: 520px;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- Night Window -->
  <div class="window">
    <div class="window-panes">
      <div class="pane"></div>
      <div class="pane"></div>
      <div class="pane"></div>
      <div class="pane"></div>
    </div>
    <div class="moon"></div>
  </div>

  <!-- Big Punch Headline -->
  <div class="headline">FAKE SLEEP?</div>

  <!-- Bed & Insomniac Character -->
  <svg class="bed-container" viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg">
    <!-- Purple Wooden Headboard (Left) -->
    <rect x="0" y="20" width="80" height="500" fill="#6A0572" stroke="#121212" stroke-width="8" />
    <rect x="80" y="80" width="60" height="440" fill="#880D88" stroke="#121212" stroke-width="8" />

    <!-- Bed Base & Pillows -->
    <path d="M 120 280 Q 240 180 380 250 L 320 400 L 120 380 Z" fill="#7294D4" stroke="#121212" stroke-width="8" />
    
    <!-- Hero Character in Bed -->
    <!-- Torso (Light blue pajama shirt) -->
    <path d="M 460 260 L 620 270 Q 750 280 840 320 L 780 440 L 440 380 Z" fill="#38BDF8" stroke="#121212" stroke-width="8" />
    
    <!-- Stick Arm resting on mattress -->
    <polyline points="500,320 620,400 680,390" stroke="#121212" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hand fingers -->
    <line x1="680" y1="390" x2="715" y2="385" stroke="#121212" stroke-width="6" stroke-linecap="round" />
    <line x1="680" y1="390" x2="720" y2="400" stroke="#121212" stroke-width="6" stroke-linecap="round" />
    <line x1="680" y1="390" x2="710" y2="415" stroke="#121212" stroke-width="6" stroke-linecap="round" />

    <!-- Dark Blue Blanket covering lower body -->
    <path d="M 680 300 Q 950 320 1280 340 L 1280 520 L 520 520 L 560 410 Z" fill="#1E40AF" stroke="#121212" stroke-width="8" />

    <!-- White Egghead resting on pillow -->
    <ellipse cx="360" cy="280" rx="140" ry="130" fill="#FFFFFF" stroke="#121212" stroke-width="9" transform="rotate(-15 360 280)" />

    <!-- Sleek Black Modern Hair -->
    <path d="M 230 250 Q 220 150 340 140 Q 420 130 480 190 Q 470 260 460 270 Q 430 180 360 180 Q 270 190 230 250 Z" fill="#18181B" stroke="#121212" stroke-width="7" />

    <!-- Asymmetrical Insomnia Face -->
    <!-- Left Eyebrow (Lowered / furrowed in suspicion) -->
    <path d="M 260 290 Q 285 270 315 285" stroke="#121212" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Right Eyebrow (Arched high / racing brain) -->
    <path d="M 360 260 Q 380 230 415 245" stroke="#121212" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Left Eye (Squinting / half-closed with under-eye bag) -->
    <ellipse cx="290" cy="310" rx="20" ry="12" fill="#FFFFFF" stroke="#121212" stroke-width="5" />
    <circle cx="292" cy="310" r="7" fill="#121212" />
    <path d="M 275 328 Q 295 338 315 328" stroke="#121212" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Right Eye (Giant, wide open, unable to sleep) -->
    <circle cx="390" cy="280" r="32" fill="#FFFFFF" stroke="#121212" stroke-width="6" />
    <circle cx="390" cy="280" r="10" fill="#121212" />

    <!-- Mouth (Slight downward frustrated grimace) -->
    <path d="M 370 360 Q 400 340 430 360" stroke="#121212" stroke-width="7" stroke-linecap="round" fill="none" />
  </svg>

</body>
</html>
