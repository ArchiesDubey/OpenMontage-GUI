<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Thumbnail: Whistleblower Degradation (Devsplainers Archetype)</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap');

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1920px;
        height: 1080px;
        background: #0a0a0a;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 80px 100px 50px;
        position: relative;
      }

      /* Infinite Pitch Black Space */
      .bg-void {
        position: absolute;
        inset: 0;
        background: #0a0a0a;
        z-index: 0;
      }

      /* Top Headline Zone */
      .headline-container {
        z-index: 10;
        text-align: center;
        margin-top: 10px;
      }

      .headline {
        font-size: 140px;
        font-weight: 900;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        line-height: 1;
      }

      .headline .accent-red {
        color: #ef4444;
        margin-left: 20px;
      }

      /* Main Geometric Stage */
      .stage {
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 100px;
        margin-bottom: 70px;
      }

      /* Left Primitive (Pure, Solid, Intact) */
      .primitive-left-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .circle-intact {
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: #38bdf8;
        border: 5px solid #ffffff;
        box-shadow: 14px 14px 0px #ffd600;
      }

      .primitive-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #ffffff;
      }

      /* Center Vector Arrow */
      .arrow-box {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .arrow-svg {
        width: 150px;
        height: 100px;
      }

      /* Right Primitive (Fragmented, Quantized, Sliced) */
      .primitive-right-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .grid-fragmented {
        width: 320px;
        height: 320px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 20px;
      }

      .block {
        border-radius: 8px;
        border: 4px solid #ffffff;
      }

      .block-1 { background: #ef4444; box-shadow: 8px 8px 0px #ffd600; }
      .block-2 { background: #ffd600; box-shadow: 8px 8px 0px #38bdf8; }
      .block-3 { background: #38bdf8; box-shadow: 8px 8px 0px #ef4444; }
      .block-4 { background: #ef4444; box-shadow: 8px 8px 0px #ffd600; }

      .primitive-label-red {
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #f87171;
      }

      /* Bottom Watermark Tag */
      .watermark-container {
        z-index: 10;
        align-self: flex-end;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 700;
        color: #a5a5a5;
        letter-spacing: 0.1em;
      }

      .watermark-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 12px #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="bg-void"></div>

    <!-- 1. Headline Zone -->
    <div class="headline-container">
      <h1 class="headline">
        <span>QUIETLY</span>
        <span class="accent-red">EXTINCT</span>
      </h1>
    </div>

    <!-- 2. Geometric Degradation Stage -->
    <div class="stage">
      <!-- Left: Intact Consumer Allocation -->
      <div class="primitive-left-box">
        <div class="circle-intact"></div>
        <div class="primitive-label">RETAIL CONSUMER SILICON</div>
      </div>

      <!-- Arrow -->
      <div class="arrow-box">
        <svg class="arrow-svg" viewBox="0 0 120 60">
          <path d="M 10,30 H 90 M 70,10 L 105,30 L 70,50" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Right: Fragmented Cloud Sacrificed Allocation -->
      <div class="primitive-right-box">
        <div class="grid-fragmented">
          <div class="block block-1"></div>
          <div class="block block-2"></div>
          <div class="block block-3"></div>
          <div class="block block-4"></div>
        </div>
        <div class="primitive-label-red">3:1 HBM REALLOCATION · 100% GONE</div>
      </div>
    </div>

    <!-- 3. Bottom Channel Watermark -->
    <div class="watermark-container">
      <span>&lt;openmontage&gt;</span>
      <div class="watermark-dot"></div>
    </div>
  </body>
</html>
